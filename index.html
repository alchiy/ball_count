<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BSO Counter</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#050505;
    color:white;

    font-family:Arial, Helvetica, sans-serif;
}

/* =========================
   BSO LEFT
========================= */

.bso-area{

    position:fixed;

    left:5vw;
    top:50%;

    transform:translateY(-50%);

    display:flex;
    flex-direction:column;

    gap:32px;

    z-index:10;
}

.row{
    display:flex;
    align-items:center;

    gap:20px;
}

.label{

    width:70px;

    font-size:min(11vw,110px);
    font-weight:700;

    text-align:center;

    cursor:pointer;
    user-select:none;
}

.lights{
    display:flex;

    gap:14px;
}

.light{

    width:min(10vw,95px);
    height:min(10vw,95px);

    border-radius:50%;

    background:#1f1f1f;

    box-shadow:
        inset 0 0 18px rgba(0,0,0,0.95),
        0 0 10px rgba(0,0,0,0.7);

    cursor:pointer;

    transition:0.15s;
}

/* =========================
   LIGHT ON
========================= */

.light.green.on{

    background:#42ff2f;

    box-shadow:
        0 0 25px #42ff2f,
        0 0 55px rgba(66,255,47,0.7),
        inset 0 0 12px rgba(255,255,255,0.6);
}

.light.yellow.on{

    background:#ffe533;

    box-shadow:
        0 0 25px #ffe533,
        0 0 55px rgba(255,229,51,0.7),
        inset 0 0 12px rgba(255,255,255,0.6);
}

.light.red.on{

    background:#ff3434;

    box-shadow:
        0 0 25px #ff3434,
        0 0 55px rgba(255,52,52,0.7),
        inset 0 0 12px rgba(255,255,255,0.6);
}

/* =========================
   FIELD RIGHT
========================= */

.right-area{

    position:fixed;

    right:7vw;
    top:50%;

    transform:translateY(-42%);

    z-index:5;
}

.field-svg{

    width:min(28vw,320px);
    height:auto;

    overflow:visible;
}

.diamond-line{

    fill:none;

    stroke:white;
    stroke-width:6;
}

.base{

    fill:#222;

    stroke:white;
    stroke-width:5;

    cursor:pointer;

    transition:0.15s;
}

.base.on{

    fill:#ff4040;

    filter:drop-shadow(0 0 12px #ff4040);
}

/* =========================
   UNDO BUTTON
========================= */

.undo-btn{

    position:fixed;

    top:12px;
    right:12px;

    padding:10px 18px;

    border:none;
    border-radius:14px;

    background:rgba(45,45,45,0.92);

    color:white;

    font-size:24px;
    font-weight:bold;

    cursor:pointer;

    z-index:9999;
}

.undo-btn:active{

    transform:scale(0.96);
}

/* =========================
   PORTRAIT
========================= */

@media (orientation: portrait){

    .bso-area{

        left:4vw;
        top:44%;
    }

    .right-area{

        right:4vw;
        top:54%;
    }

    .field-svg{

        width:34vw;
    }

    .light{

        width:11vw;
        height:11vw;
    }
}

</style>
</head>

<body>

<button class="undo-btn" onclick="undo()">↩ 戻す</button>

<!-- =========================
     LEFT : BSO
========================= -->

<div class="bso-area">

    <!-- BALL -->
    <div class="row">

        <div class="label"
             onclick="decrease('ball')">B</div>

        <div class="lights">

            <div class="light green"
                 id="b1"
                 onclick="increase('ball')"></div>

            <div class="light green"
                 id="b2"
                 onclick="increase('ball')"></div>

            <div class="light green"
                 id="b3"
                 onclick="increase('ball')"></div>

        </div>

    </div>

    <!-- STRIKE -->
    <div class="row">

        <div class="label"
             onclick="decrease('strike')">S</div>

        <div class="lights">

            <div class="light yellow"
                 id="s1"
                 onclick="increase('strike')"></div>

            <div class="light yellow"
                 id="s2"
                 onclick="increase('strike')"></div>

        </div>

    </div>

    <!-- OUT -->
    <div class="row">

        <div class="label"
             onclick="decrease('out')">O</div>

        <div class="lights">

            <div class="light red"
                 id="o1"
                 onclick="increase('out')"></div>

            <div class="light red"
                 id="o2"
                 onclick="increase('out')"></div>

        </div>

    </div>

</div>

<!-- =========================
     RIGHT : FIELD
========================= -->

<div class="right-area">

    <svg class="field-svg"
         viewBox="0 0 300 300">

        <!-- diamond -->

        <polygon
            class="diamond-line"
            points="150,30 270,150 150,270 30,150"
        />

        <!-- first -->

        <rect
            id="first"
            class="base"

            x="225"
            y="125"

            width="50"
            height="50"

            rx="6"

            transform="rotate(45 250 150)"

            onclick="toggleBase('first')"
        />

        <!-- second -->

        <rect
            id="second"
            class="base"

            x="125"
            y="25"

            width="50"
            height="50"

            rx="6"

            transform="rotate(45 150 50)"

            onclick="toggleBase('second')"
        />

        <!-- third -->

        <rect
            id="third"
            class="base"

            x="25"
            y="125"

            width="50"
            height="50"

            rx="6"

            transform="rotate(45 50 150)"

            onclick="toggleBase('third')"
        />

    </svg>

</div>

<script>

/* =========================
   STATE
========================= */

let state = {

    ball:0,
    strike:0,
    out:0,

    first:false,
    second:false,
    third:false
};

let history = [];

/* =========================
   SAVE HISTORY
========================= */

function saveHistory(){

    history.push(JSON.stringify(state));

    if(history.length > 100){

        history.shift();
    }
}

/* =========================
   UNDO
========================= */

function undo(){

    if(history.length === 0) return;

    state = JSON.parse(history.pop());

    render();
}

/* =========================
   INCREASE
========================= */

function increase(type){

    saveHistory();

    /* BALL */

    if(type === 'ball'){

        state.ball++;

        if(state.ball >= 4){

            walkAdvance();

            state.ball = 0;
            state.strike = 0;
        }
    }

    /* STRIKE */

    if(type === 'strike'){

        state.strike++;

        if(state.strike >= 3){

            state.ball = 0;
            state.strike = 0;
        }
    }

    /* OUT */

    if(type === 'out'){

        state.out++;

        if(state.out >= 3){

            state.ball = 0;
            state.strike = 0;
            state.out = 0;

            state.first = false;
            state.second = false;
            state.third = false;
        }
    }

    render();
}

/* =========================
   DECREASE
========================= */

function decrease(type){

    saveHistory();

    if(type === 'ball' && state.ball > 0){

        state.ball--;
    }

    if(type === 'strike' && state.strike > 0){

        state.strike--;
    }

    if(type === 'out' && state.out > 0){

        state.out--;
    }

    render();
}

/* =========================
   BASE TOGGLE
========================= */

function toggleBase(base){

    saveHistory();

    state[base] = !state[base];

    render();
}

/* =========================
   WALK
========================= */

function walkAdvance(){

    if(state.first && state.second){

        state.third = true;
    }

    if(state.first){

        state.second = true;
    }

    state.first = true;
}

/* =========================
   RENDER
========================= */

function render(){

    /* BALL */

    for(let i=1;i<=3;i++){

        document
            .getElementById('b'+i)
            .classList.toggle('on', i <= state.ball);
    }

    /* STRIKE */

    for(let i=1;i<=2;i++){

        document
            .getElementById('s'+i)
            .classList.toggle('on', i <= state.strike);
    }

    /* OUT */

    for(let i=1;i<=2;i++){

        document
            .getElementById('o'+i)
            .classList.toggle('on', i <= state.out);
    }

    /* BASE */

    document
        .getElementById('first')
        .classList.toggle('on', state.first);

    document
        .getElementById('second')
        .classList.toggle('on', state.second);

    document
        .getElementById('third')
        .classList.toggle('on', state.third);
}

render();

</script>

</body>
</html>
